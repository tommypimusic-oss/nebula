<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Idea Nebula | The Collective</title>
    
    <!-- 1. Styles & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
      body { 
        background-color: #000000; 
        color: white; 
        margin: 0; 
        overflow: hidden; 
        touch-action: none;
        overscroll-behavior: none;
      }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #000; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #555; }
      
      .fade-in { animation: fadeIn 0.5s ease-out; }
      @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
      
      .star-burst { animation: starBurst 0.6s ease-out forwards; }
      @keyframes starBurst {
        0% { transform: scale(0.5); opacity: 0; }
        50% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      
      .pulse-fav { animation: pulseFav 1s ease-in-out; }
      @keyframes pulseFav {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
      }

      .custom-scroll::-webkit-scrollbar { width: 6px; }
      .custom-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
      .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
      .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }
    </style>

    <!-- 2. React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 3. Firebase Compat (The Fix) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="root"></div>

    <!-- 4. Application Logic -->
    <script type="text/babel">
        // 🔴 FIREBASE CONFIG 🔴
        const firebaseConfig = {
          apiKey: "AIzaSyBCBXsY55rxtKUx2HYXA7riczMRTiRKgMA",
          authDomain: "idea-nebula.firebaseapp.com",
          projectId: "idea-nebula",
          storageBucket: "idea-nebula.firebasestorage.app",
          messagingSenderId: "606687457668",
          appId: "1:606687457668:web:cdca14efacc9516b2aedd1",
          measurementId: "G-HGDDEJ8N20"
        };

        // Initialize Firebase (Compat Mode)
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Enable Offline Persistence
        db.enablePersistence().catch((err) => {
            if (err.code == 'failed-precondition') {
                console.warn('Multiple tabs open, persistence disabled.');
            } else if (err.code == 'unimplemented') {
                console.warn('Browser does not support persistence.');
            }
        });

        const { useState, useEffect, useRef } = React;

        // --- COLLIDER LOGIC ---
        const generateRemix = (texts) => {
            let pool = [];
            texts.forEach(text => {
                const lines = text.split(/[\n.]+/);
                lines.forEach(line => {
                    const clean = line.trim();
                    if (clean.length > 5) pool.push(clean);
                });
            });

            if (pool.length === 0) return "The void is silent.";
            pool.sort(() => Math.random() - 0.5);

            const output = [];
            let currentLine = pool.shift();
            output.push(currentLine);
            const targetLength = Math.floor(Math.random() * 5) + 3;

            while (output.length < targetLength && pool.length > 0) {
                const currentWords = new Set(currentLine.toLowerCase().match(/\b[a-z]{3,}\b/g) || []);
                let foundMatch = false;
                for (let i = 0; i < pool.length; i++) {
                    const candidate = pool[i];
                    const candidateWords = new Set(candidate.toLowerCase().match(/\b[a-z]{3,}\b/g) || []);
                    const intersection = new Set([...currentWords].filter(x => candidateWords.has(x)));
                    if (intersection.size > 0) {
                        currentLine = pool.splice(i, 1)[0];
                        output.push(currentLine);
                        foundMatch = true;
                        break;
                    }
                }
                if (!foundMatch) {
                    currentLine = pool.shift();
                    output.push(currentLine);
                }
            }
            return output.join('\n');
        };

        const fnv1aHash = (str, seed) => {
            let h = 0x811c9dc5 ^ seed;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 0x01000193);
            }
            return (h >>> 0) / 4294967296;
        };

        // --- MAIN COMPONENT ---
        function IdeaNebula() {
            const [ideas, setIdeas] = useState([]);
            const [hoveredNode, setHoveredNode] = useState(null);
            const [selectedNode, setSelectedNode] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [user, setUser] = useState(null);
            
            const [showAddModal, setShowAddModal] = useState(false);
            const [showRemixModal, setShowRemixModal] = useState(false);
            const [showFavorites, setShowFavorites] = useState(false);
            const [remixResult, setRemixResult] = useState('');
            const [remixSources, setRemixSources] = useState([]);
            const [newContent, setNewContent] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            
            // View State
            const [view, setView] = useState({ x: 0, y: 0, k: 1 });
            const [isDragging, setIsDragging] = useState(false);
            const dragStart = useRef({ x: 0, y: 0 });

            // Favorites State
            const [favorites, setFavorites] = useState(() => {
                const saved = localStorage.getItem('nebulaFavorites');
                return saved ? JSON.parse(saved) : [];
            });
            const [favoritesFilter, setFavoritesFilter] = useState('all');
            const [favoritesSearch, setFavoritesSearch] = useState('');
            const [starAnimation, setStarAnimation] = useState(null);
            const importInputRef = useRef(null);

            const canvasRef = useRef(null);
            const requestRef = useRef();

            useEffect(() => {
                localStorage.setItem('nebulaFavorites', JSON.stringify(favorites));
            }, [favorites]);

            // Auth & Data Sync
            useEffect(() => {
                const unsubAuth = auth.onAuthStateChanged((currentUser) => {
                    if (currentUser) {
                        setUser(currentUser);
                    } else {
                        auth.signInAnonymously().catch(console.error);
                    }
                });
                return () => unsubAuth();
            }, []);

            useEffect(() => {
                if (!user) return; 

                const q = db.collection("ideas").orderBy("timestamp", "desc");
                
                const unsubData = q.onSnapshot((snapshot) => {
                    const loadedIdeas = snapshot.docs.map(doc => {
                        const data = doc.data();
                        const randX = fnv1aHash(doc.id, 0x811c9dc5);
                        const randY = fnv1aHash(doc.id, 0x1000193); 
                        const worldW = 4000;
                        const worldH = 4000;
                        const padding = 200;
                        
                        return {
                            id: doc.id,
                            content: data.content,
                            timestamp: data.timestamp, 
                            x: (padding) + (randX * (worldW - padding * 2)),
                            y: (padding) + (randY * (worldH - padding * 2)),
                            glimmer: null
                        };
                    });
                    setIdeas(loadedIdeas);
                });

                return () => unsubData();
            }, [user]);

            // Utils
            const toggleFavorite = (text, type = 'collision', metadata = {}) => {
                if (!text) return;
                const exists = favorites.find(f => f.text === text);
                let newFavs;
                setStarAnimation(text);
                setTimeout(() => setStarAnimation(null), 600);
                if (exists) {
                    newFavs = favorites.filter(f => f.text !== text);
                } else {
                    newFavs = [{ 
                        id: Date.now() + Math.random(),
                        text, type,
                        date: new Date().toISOString(),
                        timestamp: Date.now(),
                        ...metadata
                    }, ...favorites];
                }
                setFavorites(newFavs);
            };

            const isFav = (text) => favorites.some(f => f.text === text);

            const filteredFavorites = favorites.filter(fav => {
                if (favoritesFilter !== 'all' && fav.type !== favoritesFilter) return false;
                if (favoritesSearch && !fav.text.toLowerCase().includes(favoritesSearch.toLowerCase())) return false;
                return true;
            });
            const sortedFavorites = [...filteredFavorites].sort((a, b) => b.timestamp - a.timestamp);

            const exportFavorites = () => {
                const dataStr = JSON.stringify(favorites, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', `nebula-favorites-${new Date().toISOString().split('T')[0]}.json`);
                linkElement.click();
            };

            const importFavorites = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (Array.isArray(imported)) {
                            const merged = [...favorites];
                            imported.forEach(item => {
                                if (!merged.find(f => f.text === item.text)) merged.push({...item, id: Date.now() + Math.random()});
                            });
                            setFavorites(merged);
                            alert(`Imported ${imported.length} favorites`);
                        }
                    } catch (err) { alert('Invalid file format'); }
                };
                reader.readAsText(file);
            };

            // Canvas & Interaction
            const screenToWorld = (sx, sy) => ({
                x: (sx - view.x) / view.k,
                y: (sy - view.y) / view.k
            });

            const draw = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.setTransform(view.k, 0, 0, view.k, view.x, view.y);

                if (ideas.length > 0 && Math.random() < 0.1) {
                    const target = ideas[Math.floor(Math.random() * ideas.length)];
                    if (!target.glimmer) {
                        const colors = ['#facc15', '#ffffff', '#fb923c', '#ef4444'];
                        target.glimmer = { life: 1.0, color: colors[Math.floor(Math.random() * colors.length)] };
                    }
                }

                ideas.forEach(node => {
                    const matchesSearch = searchTerm && node.content.toLowerCase().includes(searchTerm.toLowerCase());
                    const isDimmed = searchTerm && !matchesSearch;
                    
                    let color = '#ffffff';
                    let radius = 2;
                    let glow = 0;

                    if (node.id === selectedNode?.id || remixSources.includes(node.id)) {
                        color = '#facc15'; radius = 4; glow = 15;
                    } else if (node.id === hoveredNode?.id) {
                        color = '#facc15'; radius = 3; glow = 10;
                    } else if (matchesSearch) {
                        color = '#facc15'; radius = 3;
                    } else if (isDimmed) {
                        color = '#333333';
                    } else if (node.glimmer) {
                        color = node.glimmer.color; radius = 3; glow = 10;
                        node.glimmer.life -= 0.02;
                        if (node.glimmer.life <= 0) node.glimmer = null;
                    }

                    const drawnRadius = Math.max(radius, 1.5 / view.k);
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, drawnRadius, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.shadowBlur = glow / view.k;
                    ctx.shadowColor = color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                if (remixSources.length > 1) {
                   const nodes = ideas.filter(i => remixSources.includes(i.id));
                   if (nodes.length > 1) {
                       ctx.beginPath();
                       ctx.strokeStyle = '#facc15';
                       ctx.lineWidth = 1 / view.k;
                       ctx.globalAlpha = 0.6;
                       ctx.moveTo(nodes[0].x, nodes[0].y);
                       for(let i=1; i<nodes.length; i++) ctx.lineTo(nodes[i].x, nodes[i].y);
                       ctx.lineTo(nodes[0].x, nodes[0].y);
                       ctx.stroke();
                       ctx.globalAlpha = 1.0;
                   }
                }
                requestRef.current = requestAnimationFrame(draw);
            };

            useEffect(() => {
                const handleResize = () => {
                    if(canvasRef.current) {
                        canvasRef.current.width = window.innerWidth;
                        canvasRef.current.height = window.innerHeight;
                    }
                };
                window.addEventListener('resize', handleResize);
                handleResize();
                requestRef.current = requestAnimationFrame(draw);
                return () => cancelAnimationFrame(requestRef.current);
            }, [ideas, hoveredNode, selectedNode, searchTerm, remixSources, view]);

            // Interactions
            const handleWheel = (e) => {
                e.preventDefault();
                const zoomIntensity = 0.001;
                const zoomFactor = Math.exp(-e.deltaY * zoomIntensity);
                const rect = canvasRef.current.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;
                let newK = view.k * zoomFactor;
                newK = Math.max(0.1, Math.min(newK, 5));
                const newX = mx - (mx - view.x) * (newK / view.k);
                const newY = my - (my - view.y) * (newK / view.k);
                setView({ k: newK, x: newX, y: newY });
            };

            const handleMouseDown = (e) => {
                setIsDragging(true);
                dragStart.current = { x: e.clientX, y: e.clientY };
            };

            const handleMouseUp = () => setIsDragging(false);

            const handleMouseMove = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                const sx = e.clientX - rect.left;
                const sy = e.clientY - rect.top;

                if (isDragging) {
                    const dx = e.clientX - dragStart.current.x;
                    const dy = e.clientY - dragStart.current.y;
                    setView(prev => ({ ...prev, x: prev.x + dx, y: prev.y + dy }));
                    dragStart.current = { x: e.clientX, y: e.clientY };
                    return;
                }

                const { x: wx, y: wy } = screenToWorld(sx, sy);
                let found = null;
                const hitRadius = 10 / view.k; 
                for (let i = ideas.length - 1; i >= 0; i--) {
                    const node = ideas[i];
                    if (Math.hypot(node.x - wx, node.y - wy) < Math.max(hitRadius, 5)) {
                        found = node; 
                        break; 
                    }
                }
                setHoveredNode(found);
            };

            const handleClick = () => {
                if (hoveredNode) {
                    setSelectedNode(hoveredNode);
                } else {
                    setSelectedNode(null);
                    setRemixSources([]);
                }
            };

            const handleAddIdea = async () => {
                if (!newContent.trim() || !user) return;
                setIsSubmitting(true);
                try {
                    await db.collection("ideas").add({
                        content: newContent,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        source: "anonymous"
                    });
                    setNewContent('');
                    setShowAddModal(false);
                } catch (e) { alert("Failed to transmit."); }
                finally { setIsSubmitting(false); }
            };

            const handleRemix = () => {
                if (ideas.length < 3) return;
                const count = Math.floor(Math.random() * 3) + 3;
                const shuffled = [...ideas].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, count);
                const result = generateRemix(selected.map(i => i.content));
                setRemixResult(result);
                setRemixSources(selected.map(i => i.id));
                setShowRemixModal(true);
            };

            const resetView = () => setView({ x: 0, y: 0, k: 1 });

            // UI
            return (
                <div className="w-screen h-screen bg-black overflow-hidden font-sans text-white select-none relative">
                    <canvas 
                        ref={canvasRef} 
                        className="absolute inset-0 z-0 cursor-crosshair active:cursor-move touch-none"
                        onMouseMove={handleMouseMove}
                        onMouseDown={handleMouseDown}
                        onMouseUp={handleMouseUp}
                        onMouseLeave={handleMouseUp}
                        onWheel={handleWheel}
                        onClick={handleClick}
                    />

                    {/* Top Bar */}
                    <div className="absolute top-0 left-0 w-full p-4 md:p-6 flex flex-col md:flex-row justify-between items-start md:items-center z-10 pointer-events-none gap-4">
                        <div className="pointer-events-auto">
                            <h1 className="text-xl md:text-3xl font-light tracking-[0.2em] text-white opacity-90">IDEA NEBULA</h1>
                            <div className="text-[10px] md:text-xs text-zinc-500 mt-1 font-mono flex items-center gap-2">
                                <span className={`w-2 h-2 rounded-full ${user ? 'bg-green-500 animate-pulse' : 'bg-red-500'}`}></span>
                                {user ? `CONNECTED • ${ideas.length}` : "OFFLINE"}
                            </div>
                        </div>
                        <div className="flex gap-2 pointer-events-auto w-full md:w-auto">
                            <div className="bg-zinc-900/80 backdrop-blur border border-zinc-800 rounded-full px-4 py-2 flex items-center gap-2 shadow-lg flex-1 md:w-64 transition-all">
                                <i className="ph ph-magnifying-glass text-zinc-400"></i>
                                <input type="text" placeholder="Search..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="bg-transparent border-none outline-none text-sm w-full text-white placeholder-zinc-500" />
                            </div>
                            <button onClick={resetView} className="bg-zinc-800 text-zinc-400 hover:text-white w-10 h-10 rounded-full shadow-lg transition-all hover:scale-105 flex items-center justify-center shrink-0">
                                <i className="ph ph-crosshair text-lg"></i>
                            </button>
                            <button onClick={() => setShowFavorites(true)} className="bg-zinc-100 hover:bg-white text-black w-10 h-10 md:w-auto md:px-4 rounded-full shadow-lg transition-transform hover:scale-105 flex items-center justify-center shrink-0 relative">
                                <i className="ph-fill ph-star text-lg font-bold"></i>
                                {favorites.length > 0 && <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] rounded-full w-5 h-5 flex items-center justify-center">{favorites.length}</span>}
                            </button>
                            <button onClick={() => setShowAddModal(true)} className="bg-zinc-100 hover:bg-white text-black w-10 h-10 md:w-auto md:px-4 rounded-full shadow-lg transition-transform hover:scale-105 flex items-center justify-center shrink-0">
                                <i className="ph ph-plus text-lg font-bold"></i>
                            </button>
                        </div>
                    </div>

                    {/* Remix Button */}
                    <div className="absolute bottom-10 left-1/2 -translate-x-1/2 z-10 pointer-events-auto">
                        <button onClick={handleRemix} className="group flex items-center gap-2 bg-zinc-900/90 backdrop-blur border border-zinc-700 hover:border-yellow-500 text-white px-8 py-3 rounded-full shadow-2xl transition-all hover:scale-105 active:scale-95">
                            <i className="ph ph-shuffle text-yellow-500 text-lg group-hover:animate-spin"></i>
                            <span className="font-bold tracking-wide group-hover:text-yellow-500 transition-colors">COLLIDE</span>
                        </button>
                    </div>

                    {/* Add Modal */}
                    {showAddModal && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 fade-in">
                            <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-lg shadow-2xl">
                                <div className="flex justify-between items-center mb-4">
                                    <h2 className="text-xl font-light text-white">Contribute to the Void</h2>
                                    <button onClick={() => setShowAddModal(false)} className="text-zinc-500 hover:text-white"><i className="ph ph-x text-xl"></i></button>
                                </div>
                                <textarea value={newContent} onChange={(e) => setNewContent(e.target.value)} placeholder="Type a lyric, a thought, or a fragment of a dream..." className="w-full h-40 bg-black border border-zinc-800 rounded-xl p-4 text-zinc-200 focus:border-yellow-500 outline-none resize-none mb-4" />
                                <button onClick={handleAddIdea} disabled={isSubmitting} className="w-full bg-white text-black font-bold py-3 rounded-xl hover:bg-zinc-200 transition-colors disabled:opacity-50">
                                    {isSubmitting ? "Transmitting..." : "Release to Nebula"}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Remix Result */}
                    {showRemixModal && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 fade-in">
                            <div className="bg-zinc-900 border border-zinc-800 p-8 rounded-2xl w-full max-w-lg shadow-2xl flex flex-col max-h-[80vh]">
                                <button onClick={() => setShowRemixModal(false)} className="absolute top-4 right-4 text-zinc-500 hover:text-white"><i className="ph ph-x text-xl"></i></button>
                                <div className="text-center mb-6"><div className="inline-block px-3 py-1 rounded-full bg-yellow-500/10 text-yellow-500 text-xs font-bold tracking-widest mb-2">COLLISION DETECTED</div></div>
                                <div className="flex-grow overflow-y-auto custom-scroll bg-black/50 p-6 rounded-xl border border-zinc-800/50 mb-6 relative group">
                                    <p className="text-lg md:text-xl text-zinc-100 font-serif leading-loose whitespace-pre-wrap text-center">{remixResult}</p>
                                    <button onClick={() => toggleFavorite(remixResult, 'collision', { source: 'remix' })} className={`absolute top-2 right-2 transition-all ${starAnimation === remixResult ? 'star-burst' : ''}`}>
                                        <i className={`text-xl ${isFav(remixResult) ? 'ph-fill ph-heart text-red-500' : 'ph ph-heart text-zinc-500 hover:text-red-500'}`}></i>
                                    </button>
                                </div>
                                <div className="flex justify-center">
                                    <button onClick={handleRemix} className="flex items-center gap-2 text-sm text-zinc-400 hover:text-white transition-colors"><i className="ph ph-shuffle"></i> Reroll</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Favorites Modal */}
                    {showFavorites && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 fade-in">
                            <div className="bg-zinc-900 border border-zinc-800 p-6 rounded-2xl w-full max-w-2xl shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="flex justify-between items-center mb-6 border-b border-zinc-800 pb-4">
                                    <h2 className="text-xl font-light text-white flex items-center gap-2">
                                        <i className="ph-fill ph-star text-yellow-500"></i> STARRED FRAGMENTS <span className="text-sm text-zinc-500 ml-2">({favorites.length})</span>
                                    </h2>
                                    <button onClick={() => setShowFavorites(false)} className="text-zinc-500 hover:text-white"><i className="ph ph-x text-xl"></i></button>
                                </div>
                                <div className="grid grid-cols-3 gap-2 mb-6">
                                    <div className="bg-black/30 p-3 rounded-lg text-center"><div className="text-2xl font-bold text-white">{favorites.length}</div><div className="text-xs text-zinc-500">Total</div></div>
                                    <div className="bg-black/30 p-3 rounded-lg text-center"><div className="text-2xl font-bold text-yellow-500">{favorites.filter(f => f.type === 'collision').length}</div><div className="text-xs text-zinc-500">Collisions</div></div>
                                    <div className="bg-black/30 p-3 rounded-lg text-center"><div className="text-2xl font-bold text-blue-500">{favorites.filter(f => f.type === 'signal').length}</div><div className="text-xs text-zinc-500">Signals</div></div>
                                </div>
                                <div className="flex flex-col md:flex-row gap-3 mb-6">
                                    <div className="bg-zinc-800/50 rounded-lg p-2 flex gap-1">
                                        {['all', 'collision', 'signal'].map(type => (
                                            <button key={type} onClick={() => setFavoritesFilter(type)} className={`px-3 py-1 rounded-md text-xs font-medium transition-colors ${favoritesFilter === type ? 'bg-zinc-700 text-white' : 'text-zinc-400 hover:text-white'}`}>{type.toUpperCase()}</button>
                                        ))}
                                    </div>
                                    <div className="bg-black/50 border border-zinc-800 rounded-lg px-3 py-2 flex items-center gap-2 flex-1">
                                        <i className="ph ph-magnifying-glass text-zinc-500"></i>
                                        <input type="text" placeholder="Search..." value={favoritesSearch} onChange={(e) => setFavoritesSearch(e.target.value)} className="bg-transparent border-none outline-none text-sm w-full text-white placeholder-zinc-500" />
                                    </div>
                                </div>
                                <div className="flex-grow overflow-y-auto space-y-3 pr-2 custom-scroll">
                                    {sortedFavorites.map(fav => (
                                        <div key={fav.id} className="bg-black/40 hover:bg-zinc-900/60 p-4 rounded-xl border border-zinc-800 group transition-all hover:border-zinc-700">
                                            <div className="flex justify-between items-start mb-2">
                                                <div className="flex items-center gap-2">
                                                    <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${fav.type === 'collision' ? 'bg-yellow-500/20 text-yellow-500' : 'bg-blue-500/20 text-blue-500'}`}>{fav.type}</span>
                                                    <span className="text-xs text-zinc-500">{new Date(fav.timestamp).toLocaleDateString()}</span>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => navigator.clipboard.writeText(fav.text)} className="opacity-0 group-hover:opacity-100 text-zinc-500 hover:text-white transition-all"><i className="ph ph-copy"></i></button>
                                                    <button onClick={() => toggleFavorite(fav.text)} className="text-red-500 hover:text-red-400 transition-colors"><i className="ph ph-trash"></i></button>
                                                </div>
                                            </div>
                                            <p className="text-sm text-zinc-200 font-serif leading-relaxed whitespace-pre-wrap select-text cursor-text line-clamp-3 hover:line-clamp-none transition-all">{fav.text}</p>
                                        </div>
                                    ))}
                                </div>
                                {favorites.length > 0 && (
                                    <div className="mt-6 pt-4 border-t border-zinc-800 flex flex-col md:flex-row justify-between items-center gap-3">
                                        <button onClick={() => setFavorites([])} className="text-xs text-red-500 hover:text-red-400 transition-colors px-3 py-1 rounded border border-red-500/30 hover:border-red-500 flex items-center gap-1"><i className="ph ph-warning"></i> Clear All</button>
                                        <div className="flex gap-2">
                                            <button onClick={() => importInputRef.current?.click()} className="text-xs text-zinc-500 hover:text-white transition-colors px-3 py-1 rounded border border-zinc-800 hover:border-zinc-600 flex items-center gap-1"><i className="ph ph-upload"></i> Import</button>
                                            <input ref={importInputRef} type="file" accept=".json" onChange={importFavorites} className="hidden" />
                                            <button onClick={exportFavorites} className="text-xs text-zinc-500 hover:text-white transition-colors px-3 py-1 rounded border border-zinc-800 hover:border-zinc-600 flex items-center gap-1"><i className="ph ph-download"></i> Export</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Detail Sidebar */}
                    <div className={`absolute top-0 right-0 h-full w-full md:w-96 bg-black/95 backdrop-blur border-l border-zinc-800 shadow-2xl transition-transform duration-300 z-40 p-8 overflow-y-auto ${selectedNode ? 'translate-x-0' : 'translate-x-full'}`}>
                        <button onClick={() => setSelectedNode(null)} className="absolute top-6 right-6 text-zinc-500 hover:text-white"><i className="ph ph-x text-xl"></i></button>
                        <div className="mt-12 relative group">
                            <div className="flex justify-between items-center mb-4">
                                <div className="inline-block px-2 py-1 rounded bg-zinc-800 text-zinc-400 text-[10px] font-bold tracking-widest mb-4">ANONYMOUS SIGNAL</div>
                                <button onClick={() => selectedNode && toggleFavorite(selectedNode.content, 'signal', { nodeId: selectedNode.id })} className={`transition-all ${starAnimation === selectedNode?.content ? 'pulse-fav' : ''}`}>
                                    <i className={`text-xl ${selectedNode && isFav(selectedNode.content) ? 'ph-fill ph-heart text-red-500' : 'ph ph-heart text-zinc-500 hover:text-red-500'}`}></i>
                                </button>
                            </div>
                            <p className="text-zinc-300 font-mono text-sm leading-relaxed whitespace-pre-wrap border-l-2 border-zinc-800 pl-4 select-text cursor-text">{selectedNode?.content}</p>
                            <div className="mt-8 pt-8 border-t border-zinc-900 text-xs text-zinc-600 font-mono">
                                RECEIVED: {selectedNode?.timestamp?.toDate ? selectedNode.timestamp.toDate().toLocaleDateString() : 'Just now'}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<IdeaNebula />);
    </script>
</body>
</html>
